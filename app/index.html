<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AeroChat - Chat like it's 2008</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;600;700&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="supabase-config.js"></script>
<script src="sounds.js"></script>
<style>
  :root {
    --sky-top: #bfe9ff;
    --sky-mid: #6fc3f0;
    --sky-deep: #0a4d8c;
    --glass: rgba(255,255,255,0.38);
    --glass-strong: rgba(255,255,255,0.62);
    --glass-border: rgba(255,255,255,0.75);
    --ink: #0b3a5c;
    --ink-soft: #3d6b8c;
    --lime: #a8e063;
    --lime-dark: #6fae2f;
    --aqua-accent: #1fa9a0;
    --shadow: 0 8px 32px rgba(10,60,100,0.25);
  }

  * { box-sizing: border-box; }

  html, body {
    margin: 0;
    min-height: 100%;
    font-family: 'Nunito Sans', sans-serif;
    color: var(--ink);
  }

  body {
    background: radial-gradient(ellipse at 50% -10%, var(--sky-top) 0%, var(--sky-mid) 55%, var(--sky-deep) 130%);
    position: relative;
    overflow-x: hidden;
  }

  h1, h2, h3, .brand, .display {
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
  }

  .bubble-layer {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 0;
    overflow: hidden;
  }
  .bubble {
    position: absolute;
    bottom: -120px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 25%, rgba(255,255,255,0.9), rgba(255,255,255,0.05) 60%, rgba(255,255,255,0.15) 100%);
    box-shadow: inset 0 0 12px rgba(255,255,255,0.4);
    animation: rise linear infinite;
    opacity: 0.5;
  }
  @keyframes rise {
    0%   { transform: translateY(0) translateX(0); opacity: 0; }
    10%  { opacity: 0.5; }
    100% { transform: translateY(-115vh) translateX(30px); opacity: 0; }
  }

  .topbar {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 16px 28px 26px;
    background: linear-gradient(180deg, #d4f77e 0%, #a8e063 55%, #7fbf3a 100%);
    box-shadow: 0 6px 18px color-mix(in srgb, var(--lime-dark) 25%, transparent);
    border-bottom-left-radius: 50% 18px;
    border-bottom-right-radius: 50% 18px;
  }
  .topbar::after {
    content: "";
    position: absolute;
    left: 0; right: 0; bottom: 0;
    height: 55%;
    background: linear-gradient(180deg, rgba(255,255,255,0.55), rgba(255,255,255,0));
    border-bottom-left-radius: 50% 18px;
    border-bottom-right-radius: 50% 18px;
    pointer-events: none;
  }
  .pill-nav {
    position: relative;
    z-index: 1;
    padding: 9px 22px;
    border-radius: 999px;
    background: linear-gradient(160deg, rgba(255,255,255,0.35), rgba(255,255,255,0.05));
    border: 1px solid rgba(255,255,255,0.7);
    color: #fff;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 15px;
    text-shadow: 0 1px 2px rgba(0,60,0,0.3);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.6), 0 3px 6px rgba(0,0,0,0.1);
    text-decoration: none;
    cursor: pointer;
  }

.hero {
  position: relative;
  z-index: 1;
  max-width: 1200px;
  margin: 0 auto;
  padding: 50px 28px 80px;
  display: grid;
  grid-template-columns: 1fr 0.85fr;
  gap: 30px;
  align-items: start;
}
  @media (max-width: 980px) {
    .hero { grid-template-columns: 1fr; }
  }

  .display-title {
    font-size: 56px;
    color: #fff;
    text-shadow: 0 3px 12px rgba(10,60,100,0.35);
    margin: 0 0 18px;
    line-height: 1.05;
  }
  .hero-copy {
    font-size: 18px;
    line-height: 1.55;
    color: #fff;
    text-shadow: 0 2px 8px rgba(10,60,100,0.3);
    margin: 0 0 20px;
  }
  .feature-list {
    list-style: none;
    padding: 0;
    margin: 26px 0 0;
    font-size: 18px;
    color: #fff;
    text-shadow: 0 2px 8px rgba(10,60,100,0.3);
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .feature-list li::before {
    content: "💧 ";
  }

  .auth-col {
    display: flex;
    flex-direction: column;
    gap: 26px;
  }
  .auth-card {
    background: var(--glass);
    backdrop-filter: blur(18px) saturate(160%);
    -webkit-backdrop-filter: blur(18px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 26px;
    box-shadow: var(--shadow), inset 0 1px 0 rgba(255,255,255,0.6);
    padding: 22px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .glossy-btn {
    width: 100%;
    border: none;
    cursor: pointer;
    padding: 16px;
    border-radius: 18px;
    font-family: 'Quicksand', sans-serif;
    font-weight: 700;
    font-size: 20px;
    color: #fff;
    background: linear-gradient(160deg, #6fd6ff, #1a8fd1);
    box-shadow: inset 0 2px 3px rgba(255,255,255,0.6), 0 4px 10px rgba(10,60,100,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .glossy-btn:hover { transform: translateY(-2px); box-shadow: inset 0 2px 3px rgba(255,255,255,0.6), 0 8px 16px rgba(10,60,100,0.4); }
  .glossy-btn:disabled { opacity: 0.6; cursor: default; transform: none; }
  .glossy-btn.signup { background: linear-gradient(160deg, #7fe3d0, #17a598); }

  .field {
    width: 100%;
    padding: 13px 16px;
    border-radius: 14px;
    border: 1px solid rgba(255,255,255,0.8);
    background: var(--glass-strong);
    box-shadow: inset 0 1px 0 rgba(255,255,255,0.8);
    font-family: 'Nunito Sans', sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    outline: none;
  }
  .field::placeholder { color: var(--ink-soft); }

  .error-text {
    font-size: 12.5px;
    color: #b3261e;
    font-weight: 700;
    min-height: 16px;
  }

  @keyframes riseIn {
    from { opacity: 0; transform: translateY(26px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .rise-in { animation: riseIn 0.65s cubic-bezier(0.22,1,0.36,1) both; }
  .rise-1 { animation-delay: 0s; }
  .rise-2 { animation-delay: 0.1s; }
  .rise-3 { animation-delay: 0.2s; }
</style>
</head>
<body>

<div class="bubble-layer" id="bubbleLayer"></div>

<div class="topbar">
  <a class="pill-nav" href="index.html">⌂ Home</a>
  <a class="pill-nav" href="dms.html">💬 Chats</a>
</div>

<div class="hero">
  <div class="rise-in rise-2">
    <h1 class="display-title">Aero Chat</h1>
    <p class="hero-copy">AeroChat is a messaging platform inspired by Discord, designed with a Frutiger Aero aesthetic. It delivers a familiar chat experience while embracing the glossy, vibrant style that defined the early 2000s.</p>
    <ul class="feature-list">
      <li>Free customization</li>
      <li>Servers &amp; channels</li>
      <li>And more!</li>
    </ul>
  </div>

  <div class="auth-col rise-in rise-3">
    <form class="auth-card" id="loginForm">
      <button type="submit" class="glossy-btn">Log In</button>
      <input class="field" id="loginUser" type="text" placeholder="Username" required>
      <input class="field" id="loginPass" type="password" placeholder="Password" required>
      <div class="error-text" id="loginError"></div>
    </form>

    <form class="auth-card" id="signupForm">
      <button type="submit" class="glossy-btn signup">Sign Up</button>
      <input class="field" id="signupUser" type="text" placeholder="Username" required>
      <input class="field" id="signupPass" type="password" placeholder="Password (6+ characters)" required>
      <div class="error-text" id="signupError"></div>
    </form>
  </div>
</div>

<script>
  const layer = document.getElementById('bubbleLayer');
  for (let i = 0; i < 16; i++) {
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 20 + Math.random() * 70;
    b.style.width = size + 'px';
    b.style.height = size + 'px';
    b.style.left = Math.random() * 100 + 'vw';
    b.style.animationDuration = (14 + Math.random() * 18) + 's';
    b.style.animationDelay = (Math.random() * -20) + 's';
    layer.appendChild(b);
    wireBubblePopSound(b);
  }

  supabaseClient.auth.getSession().then(({ data: { session } }) => {
    if (session) window.location.href = 'home.html';
  });

  function setBusy(form, busy) {
    form.querySelector('button[type="submit"]').disabled = busy;
  }

  document.getElementById('loginForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const errorEl = document.getElementById('loginError');
    const username = document.getElementById('loginUser').value.trim();
    const password = document.getElementById('loginPass').value;
    errorEl.textContent = '';
    if (!username || !password) {
      errorEl.textContent = 'Enter a username and password.';
      return;
    }
    setBusy(form, true);
    const { error } = await supabaseClient.auth.signInWithPassword({
      email: usernameToEmail(username),
      password
    });
    setBusy(form, false);
    if (error) {
      errorEl.textContent = 'Wrong username or password.';
      return;
    }
    window.location.href = 'home.html';
  });

  document.getElementById('signupForm').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const errorEl = document.getElementById('signupError');
    const username = document.getElementById('signupUser').value.trim();
    const password = document.getElementById('signupPass').value;
    errorEl.textContent = '';
    if (!username || !password) {
      errorEl.textContent = 'Enter a username and password.';
      return;
    }
    if (password.length < 6) {
      errorEl.textContent = 'Password needs to be at least 6 characters.';
      return;
    }
    if (!/^[a-zA-Z0-9_]+$/.test(username)) {
      errorEl.textContent = 'Username: letters, numbers, underscores only.';
      return;
    }
    setBusy(form, true);
    const { error } = await supabaseClient.auth.signUp({
      email: usernameToEmail(username),
      password,
      options: { data: { username } }
    });
    setBusy(form, false);
    if (error) {
      errorEl.textContent = error.message.toLowerCase().includes('already registered')
        ? 'That username is taken.'
        : error.message;
      return;
    }
    window.location.href = 'home.html';
  });
</script>

</body>
</html>
